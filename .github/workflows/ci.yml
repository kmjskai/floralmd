# Modified from Edmund by Yingkai Sun for FloralMD.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only the latest run per branch/PR matters; cancel superseded work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Keep CI on the same Xcode generation used for FloralMD development.
      # The runner OS/toolchain does not change the macOS 14 deployment target.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: xcode-spm-v1-macos26-${{ runner.os }}-${{ hashFiles('FloralMD.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: xcode-spm-v1-macos26-${{ runner.os }}-

      - name: Test
        run: ./scripts/test.sh
