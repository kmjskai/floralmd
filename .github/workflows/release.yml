# Modified from Edmund by Yingkai Sun for FloralMD.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: floralmd-release
  cancel-in-progress: false

jobs:
  test:
    name: Validate and build without release secrets
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Validate final release tag
        run: |
          VERSION="$(./scripts/release-metadata.sh version)"
          BUILD="$(./scripts/release-metadata.sh build)"
          VALIDATE_ARGS=(
            --version "$VERSION"
            --tag "$GITHUB_REF_NAME"
            --build "$BUILD"
          )
          if git cat-file -e HEAD^:Info.plist 2>/dev/null; then
            PREVIOUS_VERSION="$(git show HEAD^:Info.plist | plutil -extract CFBundleShortVersionString raw -o - -)"
            PREVIOUS_BUILD="$(git show HEAD^:Info.plist | plutil -extract CFBundleVersion raw -o - -)"
            VALIDATE_ARGS+=(--previous-version "$PREVIOUS_VERSION" --previous-build "$PREVIOUS_BUILD")
          fi
          python3 scripts/validate-release-version.py "${VALIDATE_ARGS[@]}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Test release controls
        run: python3 -m unittest discover -s scripts/tests

      # Full AppKit/XCTest coverage is run locally before the immutable release
      # commit is created. GitHub's headless macOS runner can launch the app but
      # does not reliably establish the XCTest runner connection.
      - name: Build secret-free production candidate
        run: ./scripts/build-app.sh --variant production

  release:
    name: Sign, notarize, and publish one immutable Pre-release
    needs: test
    runs-on: macos-26
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Validate protected final tag
        run: |
          VERSION="$(./scripts/release-metadata.sh version)"
          BUILD="$(./scripts/release-metadata.sh build)"
          VALIDATE_ARGS=(
            --version "$VERSION"
            --tag "$GITHUB_REF_NAME"
            --build "$BUILD"
          )
          if git cat-file -e HEAD^:Info.plist 2>/dev/null; then
            PREVIOUS_VERSION="$(git show HEAD^:Info.plist | plutil -extract CFBundleShortVersionString raw -o - -)"
            PREVIOUS_BUILD="$(git show HEAD^:Info.plist | plutil -extract CFBundleVersion raw -o - -)"
            VALIDATE_ARGS+=(--previous-version "$PREVIOUS_VERSION" --previous-build "$PREVIOUS_BUILD")
          fi
          python3 scripts/validate-release-version.py "${VALIDATE_ARGS[@]}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Detect a recoverable existing Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Build official production app
        if: env.RELEASE_EXISTS != 'true'
        run: ./scripts/build-app.sh --variant production

      - name: Sign, notarize, staple, and create final bytes
        if: env.RELEASE_EXISTS != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          FLORALMD_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.FLORALMD_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ./scripts/developer-id-release.sh \
            build/FloralMD.app \
            "build/FloralMD-${VERSION}.dmg"

      - name: Attest final DMG provenance
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: build/FloralMD-${{ env.VERSION }}.dmg

      - name: Prepare Pre-release notes
        if: env.RELEASE_EXISTS != 'true'
        run: |
          python3 scripts/extract-release-notes.py "$VERSION" > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Pre-release
        if: env.RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/FloralMD-${VERSION}.dmg" \
            "build/FloralMD-${VERSION}.sha256" \
            "build/FloralMD-${VERSION}.sparkle-signature.txt" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "FloralMD ${VERSION} Preview" \
            --notes-file release-notes.md

      - name: Download existing Pre-release assets for recovery
        if: env.RELEASE_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          gh release download "$GITHUB_REF_NAME" --dir build

      - name: Verify published Pre-release and exact final bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            > build/release.json
          python3 scripts/validate-release-promotion.py metadata \
            --release build/release.json \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --require-state prerelease
          python3 scripts/validate-release-promotion.py files \
            --release build/release.json \
            --directory build \
            --version "$VERSION"
          ./scripts/verify-release-artifact.sh \
            final-dmg \
            "build/FloralMD-${VERSION}.dmg" \
            "build/FloralMD-${VERSION}.sha256"
          gh attestation verify \
            "build/FloralMD-${VERSION}.dmg" \
            --repo "$GITHUB_REPOSITORY"

      # Deliberately no feed checkout or appcast update. The final v* tag
      # remains a Pre-release until the protected promotion workflow succeeds.
